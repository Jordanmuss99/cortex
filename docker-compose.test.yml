services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cortex_test
      POSTGRES_PASSWORD: cortex-test-password
      POSTGRES_DB: cortex_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init-cortex-db.sql:/docker-entrypoint-initdb.d/001-cortex-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex_test -d cortex_test"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
  migration_db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cortex_test
      POSTGRES_PASSWORD: cortex-test-password
      POSTGRES_DB: cortex_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init-cortex-db.sql:/docker-entrypoint-initdb.d/001-cortex-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex_test -d cortex_test"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
