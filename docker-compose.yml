version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cortex_data:/var/lib/postgresql/data
      - ./init-cortex-db.sql:/docker-entrypoint-initdb.d/init.sql

  cortex:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://cortex:cortex@db:5432/cortex"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-voyage}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      # Tunables: dedup gate threshold + vitals warning-rule overrides (JSON).
      # Set either in .env; effective vitals values are echoed by /api/v1/vitals.
      CORTEX_DUP_THRESHOLD: "${CORTEX_DUP_THRESHOLD:-}"
      CORTEX_VITALS_THRESHOLDS: "${CORTEX_VITALS_THRESHOLDS:-}"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ~/.openclaw:/root/.openclaw
      # Hot-reload tunables (vitals-thresholds.json) - edited on the host,
      # re-read per request, no restart needed.
      - ~/.cortex/config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cortex-mcp:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://cortex:cortex@db:5432/cortex"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-voyage}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      CORTEX_DUP_THRESHOLD: "${CORTEX_DUP_THRESHOLD:-}"
      CORTEX_VITALS_THRESHOLDS: "${CORTEX_VITALS_THRESHOLDS:-}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ~/.openclaw:/root/.openclaw
    stdin_open: true
    tty: true
    command: ["npx", "-y", "supergateway", "--stdio", "npx tsx src/mcp/server.ts", "--port", "8000"]


volumes:
  cortex_data:
